<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register — FeedTheNeed</title>
    <meta name="description"
        content="Sign in or create an account on FeedTheNeed — join the movement to rescue food and feed lives across Bangalore.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-22px);
            }
        }

        @keyframes floatReverse {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-16px);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.8);
            }
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Soft green blobs — only behind the card, not on it ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(134, 239, 172, 0.45), rgba(74, 222, 128, 0.2));
            top: -160px;
            left: -160px;
            animation: float 10s ease-in-out infinite;
        }

        .blob-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(134, 239, 172, 0.35), rgba(187, 247, 208, 0.15));
            bottom: -130px;
            right: -130px;
            animation: floatReverse 12s ease-in-out infinite;
        }

        .blob-3 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(167, 243, 208, 0.3), transparent);
            top: 40%;
            left: 5%;
            animation: float 14s ease-in-out infinite;
        }

        /* ── Dot grid ── */
        .dot-grid {
            background-image: radial-gradient(rgba(22, 163, 74, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* ── Card — pure white, no green tint ── */
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.04),
                0 20px 50px -10px rgba(0, 0, 0, 0.10),
                0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* ── Inputs — clean white with slate border ── */
        .form-input {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            color: #1e293b;
            border-radius: 10px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: 'DM Sans', sans-serif;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            outline: none;
            border-color: #22c55e;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        .form-input option {
            background: #fff;
            color: #1e293b;
        }

        /* ── Icon inside input ── */
        .input-icon-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.8125rem;
            pointer-events: none;
        }

        .input-icon-wrap .form-input {
            padding-left: 40px;
        }

        /* ── CTA button — green gradient only on the button ── */
        .btn-primary {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
            box-shadow: 0 4px 18px rgba(34, 197, 94, 0.32);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.42);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ── Tab switcher ── */
        .tab-wrap {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .tab-btn {
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.22s ease;
            color: #64748b;
        }

        .tab-btn:not(.tab-active):hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .tab-active {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff !important;
            box-shadow: 0 3px 12px rgba(34, 197, 94, 0.35);
        }

        /* ── Info pill ── */
        .info-pill {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 999px;
        }

        /* ── Stat badges ── */
        .stat-badge {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .stat-badge:hover {
            border-color: #bbf7d0;
            box-shadow: 0 2px 10px rgba(34, 197, 94, 0.1);
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid #f1f5f9;
        }

        /* Labels */
        .field-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.8125rem;
        }

        /* Form fade */
        #login-form,
        #register-form {
            animation: fadeIn 0.3s ease both;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen py-12 px-4 relative">

    <!-- Soft green blobs (background only) -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Dot grid overlay -->
    <div class="dot-grid fixed inset-0 z-0 opacity-60"></div>

    <div class="relative z-10 w-full max-w-md">

        <!-- Brand header above card -->
        <div class="text-center mb-7" style="animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both;">
            <a href="index.html" class="inline-flex items-center gap-3 group">
                <img src="assets/images/logo.png" alt="FeedTheNeed Logo"
                    class="w-11 h-11 object-contain drop-shadow transition-transform duration-300 group-hover:scale-105">
                <div class="text-left">
                    <p class="text-xl font-black text-slate-900 leading-none"
                        style="font-family:'Playfair Display',serif;">FeedTheNeed</p>
                    <p class="text-green-600 text-xs font-semibold tracking-wide">Rescue Food. Feed Lives.</p>
                </div>
            </a>
        </div>

        <!-- Main card -->
        <div class="login-card p-8">

            <!-- Card heading -->
            <div class="text-center mb-7">
                <div class="info-pill inline-flex items-center gap-2 px-4 py-1.5 mb-4">

                    <p class="text-green-700 text-xs font-bold uppercase tracking-widest">Join the Movement</p>
                </div>
                <h1 class="text-3xl font-black text-slate-900" style="font-family:'Playfair Display',serif;">
                    Welcome Back
                </h1>
                <p class="text-slate-500 text-sm mt-1.5">Sign in to your account or create a new one.</p>
            </div>

            <!-- Tab switcher -->
            <div class="tab-wrap flex gap-1 p-1 mb-7">
                <button id="tab-login" onclick="toggleForm('login')"
                    class="tab-btn tab-active flex-1 py-2.5 text-center">
                    <i class="fas fa-sign-in-alt mr-1.5 text-xs opacity-80"></i> Login
                </button>
                <button id="tab-register" onclick="toggleForm('register')" class="tab-btn flex-1 py-2.5 text-center">
                    <i class="fas fa-user-plus mr-1.5 text-xs opacity-80"></i> Register
                </button>
            </div>

            <!-- ── LOGIN FORM ── -->
            <form id="login-form" action="/login" method="POST" class="space-y-5">
                <div>
                    <label for="login-username" class="field-label block mb-1.5">Username</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="login-username" name="username" required
                            placeholder="Enter your username" class="form-input w-full px-4 py-3 text-sm">
                    </div>
                </div>
                <div>
                    <label for="login-password" class="field-label block mb-1.5">Password</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="login-password" name="password" required
                            placeholder="Enter your password" class="form-input w-full px-4 py-3 text-sm">
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full text-white py-3.5 text-sm mt-1">
                    <i class="fas fa-arrow-right-to-bracket mr-2"></i> Sign In
                </button>
            </form>

            <!-- ── REGISTER FORM ── -->
            <form id="register-form" action="/register" method="POST" class="space-y-5 hidden">
                <div>
                    <!-- Hidden input to hold the selected role for form submission -->
                    <input type="hidden" id="role" name="role" required value="">
                    <div class="grid grid-cols-2 gap-3 mt-1.5">
                        <button type="button" onclick="selectRole('donor')" id="role-donor"
                            class="flex flex-col items-center justify-center p-4 border-2 border-slate-200 rounded-xl hover:border-green-500 hover:bg-green-50/20 transition-all duration-200 group text-slate-700">
                            <i class="fa-solid fa-plate-wheat text-2xl text-slate-400 group-hover:text-green-500 mb-2 transition-colors"></i>
                            <span class="text-xs font-bold">Donor</span>
                            <span class="text-[10px] text-slate-400 mt-1 text-center">Donate Surplus Food</span>
                        </button>
                        <button type="button" onclick="selectRole('volunteer')" id="role-volunteer"
                            class="flex flex-col items-center justify-center p-4 border-2 border-slate-200 rounded-xl hover:border-green-500 hover:bg-green-50/20 transition-all duration-200 group text-slate-700">
                            <i class="fa-solid fa-truck text-2xl text-slate-400 group-hover:text-green-500 mb-2 transition-colors"></i>
                            <span class="text-xs font-bold">Volunteer</span>
                            <span class="text-[10px] text-slate-400 mt-1 text-center">Distribute Food</span>
                        </button>
                    </div>
                </div>
                <div>
                    <label for="reg-username" class="field-label block mb-1.5">Choose a Username</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-at input-icon"></i>
                        <input type="text" id="reg-username" name="username" required
                            placeholder="Pick a unique username" class="form-input w-full px-4 py-3 text-sm">
                    </div>
                </div>
                <div>
                    <label for="reg-password" class="field-label block mb-1.5">Create Password</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-shield-halved input-icon"></i>
                        <input type="password" id="reg-password" name="password" required
                            placeholder="Min. 8 characters" class="form-input w-full px-4 py-3 text-sm">
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full text-white py-3.5 text-sm mt-1">
                    <i class="fas fa-user-plus mr-2"></i> Create Account
                </button>
            </form>

            <!-- Divider -->
            <hr class="divider my-6">



        </div><!-- /card -->

        <!-- Back link -->
        <div class="text-center mt-5" style="animation: fadeIn 0.8s ease 0.4s both; opacity: 0;">
            <a href="index.html"
                class="inline-flex items-center gap-2 text-slate-400 hover:text-green-600 text-sm font-medium transition-colors duration-200 group">
                <i class="fas fa-arrow-left text-xs transition-transform duration-200 group-hover:-translate-x-1"></i>
                Back to Home
            </a>
        </div>

    </div><!-- /container -->

    <script>
        function toggleForm(formType) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (formType === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('tab-active');
                tabRegister.classList.remove('tab-active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('tab-active');
                tabLogin.classList.remove('tab-active');
            }
        }

        function selectRole(role) {
            // Set the value in hidden input
            document.getElementById('role').value = role;

            const donorBtn = document.getElementById('role-donor');
            const volunteerBtn = document.getElementById('role-volunteer');

            const activeClasses = ['border-green-500', 'bg-green-50/30', 'ring-2', 'ring-green-500/20'];
            
            if (role === 'donor') {
                // Highlight Donor card
                donorBtn.classList.add(...activeClasses);
                donorBtn.classList.remove('border-slate-200');
                donorBtn.querySelector('i').classList.add('text-green-500');
                donorBtn.querySelector('i').classList.remove('text-slate-400');
                
                // Clear Volunteer card
                volunteerBtn.classList.remove(...activeClasses);
                volunteerBtn.classList.add('border-slate-200');
                volunteerBtn.querySelector('i').classList.add('text-slate-400');
                volunteerBtn.querySelector('i').classList.remove('text-green-500');
            } else if (role === 'volunteer') {
                // Highlight Volunteer card
                volunteerBtn.classList.add(...activeClasses);
                volunteerBtn.classList.remove('border-slate-200');
                volunteerBtn.querySelector('i').classList.add('text-green-500');
                volunteerBtn.querySelector('i').classList.remove('text-slate-400');
                
                // Clear Donor card
                donorBtn.classList.remove(...activeClasses);
                donorBtn.classList.add('border-slate-200');
                donorBtn.querySelector('i').classList.add('text-slate-400');
                donorBtn.querySelector('i').classList.remove('text-green-500');
            }
        }
    </script>
</body>

</html>
