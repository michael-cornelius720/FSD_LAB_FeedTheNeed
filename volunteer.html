<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Dashboard — FeedTheNeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['DM Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } }
  }
</script>
<style>
  body { font-family: "DM Sans", sans-serif; background-color: #f8fafc; }
  #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(22,163,74,0.3); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; }
  #toast.show { bottom: 30px; }
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html#home" class="flex items-center gap-3">
      <img src="assets/images/logo.png" alt="FeedTheNeed Logo" class="w-12 h-11 object-contain drop-shadow-sm">
      <div>
        <p class="text-lg font-black text-slate-900 leading-none" style="font-family:'Playfair Display',serif;">FeedTheNeed</p>
        <p class="text-green-600 text-[10px] font-bold tracking-wider uppercase">Volunteer Portal</p>
      </div>
    </a>
    <div class="flex items-center gap-4">
      <div class="hidden sm:flex items-center gap-3 bg-slate-50 border border-slate-200 py-1.5 px-3 rounded-full">
        <div class="w-8 h-8 rounded-full bg-green-600 text-white font-bold flex items-center justify-center text-sm shadow-inner" id="headerAvatar">V</div>
        <span class="text-sm font-semibold text-slate-700" id="headerName">Loading...</span>
      </div>
      <a href="/login.html" onclick="localStorage.removeItem('ftn_username');" class="text-slate-500 hover:text-red-500 transition-colors" title="Logout">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
      </a>
    </div>
  </div>
</header>

<!-- PROFILE SECTION -->
<section class="bg-white border-b border-slate-200 pb-10 pt-10">
  <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center gap-6">
    <div class="w-24 h-24 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center text-white text-3xl font-black shadow-lg shadow-green-500/30" id="profileInitials">
      V
    </div>
    <div class="text-center md:text-left flex-1">
      <div class="inline-flex items-center gap-1.5 bg-green-100 text-green-700 px-3 py-1 text-[11px] font-bold uppercase tracking-widest rounded-full mb-2">
        <i class="fa-solid fa-truck-fast"></i> Delivery Volunteer
      </div>
      <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight" style="font-family:'Playfair Display',serif;">
        Welcome, <span id="welcomeName">Hero</span>!
      </h1>
      <p class="text-slate-500 mt-2 text-sm max-w-lg">Thank you for being on the frontlines of our mission. Check your assigned deliveries below and help us bridge the gap between surplus and scarcity.</p>
    </div>
    <div class="grid grid-cols-2 gap-4 bg-slate-50 rounded-xl p-4 border border-slate-100 min-w-[240px]">
      <div class="text-center">
        <div class="text-2xl font-black text-slate-800" id="statCompleted">0</div>
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Completed</div>
      </div>
      <div class="text-center border-l border-slate-200">
        <div class="text-2xl font-black text-green-600" id="statPending">0</div>
        <div class="text-[11px] font-bold text-green-600/70 uppercase tracking-wider">Pending</div>
      </div>
    </div>
  </div>
</section>

<!-- MAIN TASKS -->
<main class="max-w-6xl mx-auto px-6 py-12 flex-grow">
  <div class="mb-8 flex items-center justify-between border-b border-slate-200 pb-4">
    <h2 class="text-2xl font-black text-slate-900" style="font-family:'Playfair Display',serif;">
      <i class="fa-solid fa-list-check text-green-600 mr-2"></i> My Deliveries
    </h2>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tasksGrid">
    <!-- Cards injected by JS -->
  </div>
</main>

<div id="toast">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toastMsg">Action complete</span>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const urlUser = urlParams.get('user');
if (urlUser) {
  localStorage.setItem('ftn_username', urlUser);
  // Clean up URL
  window.history.replaceState({}, document.title, window.location.pathname);
}

let currentUser = localStorage.getItem('ftn_username');
if (!currentUser) {
  window.location.href = '/login.html';
}

// Ensure the first letter is capitalized
const displayName = currentUser.charAt(0).toUpperCase() + currentUser.slice(1);
const initials = displayName.substring(0, 2).toUpperCase();

document.getElementById('headerName').textContent = displayName;
document.getElementById('welcomeName').textContent = displayName;
document.getElementById('headerAvatar').textContent = initials;
document.getElementById('profileInitials').textContent = initials;

let donations = [];

function loadDonations() {
  try {
    const raw = localStorage.getItem("ftn_donations");
    donations = raw ? JSON.parse(raw) : [];
  } catch(e) {
    donations = [];
  }
}

function saveDonations() {
  localStorage.setItem("ftn_donations", JSON.stringify(donations));
}

function renderTasks() {
  const grid = document.getElementById("tasksGrid");
  
  // Filter where volunteer id matches the username
  const myTasks = donations.filter(d => d.volunteer && d.volunteer.id === currentUser);
  
  const completedCount = myTasks.filter(d => d.status === 'completed').length;
  const pendingCount = myTasks.filter(d => d.status !== 'completed').length;
  
  document.getElementById('statCompleted').textContent = completedCount;
  document.getElementById('statPending').textContent = pendingCount;

  if (myTasks.length === 0) {
    grid.innerHTML = `
      <div class="col-span-full flex flex-col items-center justify-center p-12 bg-white rounded-2xl border border-dashed border-slate-300 text-center">
        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 text-3xl mb-4">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-700">No active assignments</h3>
        <p class="text-slate-500 mt-2 max-w-md">You currently have no deliveries assigned to you. When the Admin assigns you a task, it will appear here.</p>
      </div>`;
    return;
  }

  grid.innerHTML = "";
  
  // Sort tasks: pending first
  myTasks.sort((a, b) => {
    if (a.status === 'completed' && b.status !== 'completed') return 1;
    if (a.status !== 'completed' && b.status === 'completed') return -1;
    return new Date(b.submittedAt) - new Date(a.submittedAt);
  });

  myTasks.forEach((d) => {
    const isCompleted = d.status === "completed";
    const card = document.createElement("div");
    card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-all flex flex-col relative h-full";
    if (isCompleted) card.classList.add('opacity-75', 'bg-slate-50');

    card.innerHTML = `
      <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-4">
        <div>
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Donor</div>
          <div class="font-bold text-slate-800 text-sm">${d.donorName || 'Unknown Donor'}</div>
          <a href="tel:${d.phone}" class="text-xs text-green-600 font-medium hover:underline flex items-center gap-1 mt-1">
            <i class="fa-solid fa-phone"></i> ${d.phone}
          </a>
        </div>
        ${isCompleted 
          ? '<span class="bg-green-50 text-green-700 border border-green-200 px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-check-double"></i> Delivered</span>'
          : '<span class="bg-orange-50 text-orange-700 border border-orange-200 px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-truck-fast"></i> Action Required</span>'
        }
      </div>

      <div class="flex-grow">
        <div class="flex gap-3 mb-5">
          <div class="mt-0.5 text-slate-300 text-lg"><i class="fa-solid fa-location-dot"></i></div>
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pickup Location</div>
            <p class="text-sm font-medium text-slate-700 leading-tight">${d.location || 'Location provided'}</p>
            ${d.location ? `<a href="https://maps.google.com/?q=${encodeURIComponent(d.location)}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-bold text-blue-600 hover:text-blue-700 mt-2"><i class="fa-solid fa-map"></i> Open in Maps</a>` : ''}
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-slate-50/50 rounded-lg p-3 mb-4 border border-slate-100">
          <div>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Food Item</div>
            <div class="text-sm font-bold text-slate-800">${d.foodName || 'Food'}</div>
          </div>
          <div>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Quantity</div>
            <div class="text-sm font-bold text-slate-800">${d.quantity} servings</div>
          </div>
        </div>
        
        ${d.notes ? `<div class="text-xs text-slate-600 bg-amber-50 border border-amber-100 p-3 rounded-lg flex gap-2"><i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i> <div>${d.notes}</div></div>` : ''}
      </div>

      ${!isCompleted ? `
      <div class="mt-5 pt-4 border-t border-slate-100">
        <button class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 px-4 rounded-xl transition-transform active:scale-95 flex items-center justify-center gap-2 complete-btn shadow-md shadow-slate-900/20" data-id="${d.id}">
          <i class="fa-solid fa-check"></i> Mark as Delivered
        </button>
      </div>` : ''}
    `;

    grid.appendChild(card);
  });

  document.querySelectorAll(".complete-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      if(confirm("Confirm that you have delivered this donation?")) {
        markCompleted(this.dataset.id);
      }
    });
  });
}

function markCompleted(id) {
  const idx = donations.findIndex(d => d.id === id);
  if (idx !== -1) {
    donations[idx].status = "completed";
    saveDonations();
    showToast("Donation marked as delivered successfully!");
    renderTasks();
  }
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), 3000);
}

// Init
loadDonations();
renderTasks();
</script>
</body>
</html>
