<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedTheNeed — Rescue Food. Feed Lives.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['DM Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
            keyframes: {
              fadeDown: { from: { opacity: '0', transform: 'translateY(-14px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
              fadeUp:   { from: { opacity: '0', transform: 'translateY(14px)'  }, to: { opacity: '1', transform: 'translateY(0)' } },
              slideUp:  { from: { opacity: '0', transform: 'translateY(20px)'  }, to: { opacity: '1', transform: 'translateY(0)' } },
            },
            animation: {
              fadeDown: 'fadeDown 0.5s ease both',
              fadeUp:   'fadeUp 0.4s ease both',
              slideUp:  'slideUp 0.3s ease both',
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      .reveal {
        opacity: 0;
        transform: translateY(55px);
        transition: all 1s ease;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body class="bg-white text-slate-800 overflow-x-hidden" style="font-family:'DM Sans',sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
